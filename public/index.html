<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0C0E">
<title>LiveCap · תרגום חי</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body class="showru">
<header>
  <div class="brand"><span class="dot"></span><h1>LiveCap</h1></div>
  <div class="pair">רוסית <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg> <b>עברית</b></div>
</header>

<div class="toolbar">
  <button class="tb" id="minus" aria-label="הקטן טקסט">א−</button>
  <button class="tb" id="plus" aria-label="הגדל טקסט">א+</button>
  <button class="tb wide on" id="ru"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h10"/><path d="M4 17h7"/></svg>מקור</button>
  <button class="tb wide" id="clear"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>נקה</button>
</div>

<main>
  <div id="caps"><div class="empty" id="empty">
    <div class="ico"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8"/><path d="M8 12h5"/></svg></div>
    <h2>מדברים ברוסית,<br>רואים עברית</h2>
    <p>לחץ על המיקרופון והתחל לדבר. התרגום יופיע כאן תוך כדי.</p>
  </div></div>
</main>

<footer class="foot">
  <button class="mic" id="mic" aria-label="התחל להקשיב"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg><span class="stop"></span></button>
  <div id="state"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span id="stxt">לחץ כדי להתחיל</span></div>
  <div id="err" class="err" role="alert"></div>
</footer>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };
  const load = k => { try { return localStorage.getItem(k); } catch (_) { return null; } };

  /* ---------- display options ---------- */
  let fs = +load('fs') || 1.6;
  const applyFs = () => { document.documentElement.style.setProperty('--fs', fs + 'rem'); store('fs', fs); };
  applyFs();
  $('plus').onclick = () => { fs = Math.min(4, +(fs + .2).toFixed(1)); applyFs(); };
  $('minus').onclick = () => { fs = Math.max(1, +(fs - .2).toFixed(1)); applyFs(); };

  const applyRu = on => { document.body.classList.toggle('showru', on); $('ru').classList.toggle('on', on); store('showru', on ? '1' : '0'); };
  applyRu(load('showru') !== '0');
  $('ru').onclick = () => applyRu(!document.body.classList.contains('showru'));

  /* ---------- captions ---------- */
  const caps = $('caps');
  let cur = null; // line still being spoken (interim)
  let stick = true;
  caps.addEventListener('scroll', () => { stick = caps.scrollHeight - caps.scrollTop - caps.clientHeight < 80; });

  function lineEl() {
    if (cur) return cur;
    const empty = $('empty'); if (empty) empty.remove();
    cur = document.createElement('div');
    cur.innerHTML = '<div class="he"></div><div class="ru"></div>';
    caps.appendChild(cur);
    while (caps.children.length > 80) caps.firstChild.remove();
    return cur;
  }
  const scroll = () => { if (stick) caps.scrollTop = caps.scrollHeight; };

  $('clear').onclick = () => {
    caps.innerHTML = '<div class="empty" id="empty"><p>המסך נוקה.</p></div>';
    cur = null; sentence = ''; interim = ''; liveText = ''; lastPiece = '';
    clearTimeout(pauseTimer);
  };

  /* ---------- translation ---------- */
  async function tr(text) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 45000); // the server may be waking up
    try {
      const r = await fetch('/api/translate', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text }), signal: ctrl.signal
      });
      if (r.status === 429) throw new Error('יותר מדי בקשות. המתן רגע.');
      if (!r.ok) throw new Error('שירות התרגום לא זמין כרגע. נסה שוב בעוד רגע.');
      return (await r.json()).he;
    } catch (e) {
      if (e.name === 'AbortError' || e instanceof TypeError) throw new Error('אין חיבור לשרת. בדוק את האינטרנט.');
      throw e;
    } finally { clearTimeout(timer); }
  }

  /* ---------- sentences ----------
     Chrome hands over speech in short pieces (it finalizes on every small pause). A lecture
     needs whole sentences, so pieces are collected into one card and translated together
     only when the sentence ends: punctuation, a pause, or a very long sentence. */
  const PAUSE_MS = 1500;      // silence that closes a sentence
  const MAX_CHARS = 300;      // close a run-on sentence at the next piece after this
  const LIVE_MS = 900;        // how often the growing sentence is re-translated
  const END_RE = /[.!?…]["»)]*$/;

  let sentence = '', interim = '', lastPiece = '';
  let pauseTimer = null, liveTimer = null, lastLiveAt = 0, liveText = '';
  const norm = t => t.toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, '').replace(/\s+/g, ' ').trim();
  const fullText = () => (sentence + ' ' + interim).trim();

  function showLive() {
    const text = fullText();
    if (!text) return;
    const el = lineEl();
    el.className = 'line interim';
    el.children[1].textContent = text;
    scroll();
    if (text === liveText || liveTimer) return;
    liveTimer = setTimeout(async () => {
      liveTimer = null;
      const target = cur, t = fullText();
      if (!target || !t || t === liveText) return;
      liveText = t; lastLiveAt = Date.now();
      try {
        const he = await tr(t);
        if (cur === target) { target.children[0].textContent = he; scroll(); }
      } catch (_) { /* the sentence translation reports errors */ }
      if (cur === target && fullText() !== liveText) showLive();
    }, Math.max(0, lastLiveAt + LIVE_MS - Date.now()));
  }

  // Chrome on Android sometimes repeats earlier words in a new final piece; keep only what is new.
  function addPiece(t) {
    const n = norm(t);
    if (!n) return;
    for (const before of [norm(sentence), norm(lastPiece)]) {
      if (!before) continue;
      if (n === before) return;
      if (n.startsWith(before + ' ')) { t = t.split(/\s+/).slice(before.split(' ').length).join(' '); break; }
    }
    if (!t) return;
    lastPiece = t;
    sentence = (sentence + ' ' + t).trim();
  }

  // Close the sentence after a pause; while Chrome still shows unfinished words, wait longer.
  function armPause(ms = PAUSE_MS) {
    clearTimeout(pauseTimer);
    pauseTimer = setTimeout(closeSentence, ms);
  }

  async function closeSentence() {
    clearTimeout(pauseTimer); clearTimeout(liveTimer); liveTimer = null;
    const text = fullText();
    sentence = ''; interim = ''; liveText = '';
    if (!text) return;
    const el = lineEl();
    cur = null;
    el.className = 'line';
    el.children[1].textContent = text;
    scroll();
    try {
      el.children[0].textContent = await tr(text);
      $('err').textContent = '';
    } catch (e) {
      el.children[0].textContent = '⚠ התרגום נכשל';
      $('err').textContent = e.message;
    }
    scroll();
  }

  function onInterim(text) {
    interim = text;
    armPause(PAUSE_MS * 2);
    showLive();
  }

  function onFinal(text) {
    interim = '';
    addPiece(text);
    if (END_RE.test(sentence) || sentence.length >= MAX_CHARS) closeSentence();
    else { showLive(); armPause(); }
  }

  /* ---------- speech recognition ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec, running = false;

  function build() {
    rec = new SR();
    rec.lang = 'ru-RU';
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    rec.onresult = e => {
      let text = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        const t = r[0].transcript.trim();
        if (r.isFinal) { if (t) onFinal(t); }
        else text += (text ? ' ' : '') + t;
      }
      if (text && text !== interim) onInterim(text);
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        $('err').textContent = 'אין הרשאת מיקרופון. אשר אותה בהגדרות האתר ונסה שוב.';
        stop();
      } else if (e.error === 'network') $('err').textContent = 'שגיאת רשת בזיהוי הדיבור';
      else if (e.error !== 'no-speech' && e.error !== 'aborted') $('err').textContent = 'שגיאת זיהוי: ' + e.error;
    };
    rec.onend = () => {
      // Chrome ends its session every so often; keep unfinished words in the sentence and restart at once
      if (interim) { const t = interim; interim = ''; addPiece(t); armPause(); }
      if (running) setTimeout(() => { try { rec.start(); } catch (_) {} }, 50);
      else closeSentence();
    };
  }

  let wake;
  async function lock() { try { wake = await navigator.wakeLock.request('screen'); } catch (_) {} }

  function start() {
    if (!SR) { $('err').textContent = 'הדפדפן לא תומך בזיהוי דיבור. השתמש ב-Chrome.'; return; }
    $('err').textContent = '';
    build(); running = true;
    try { rec.start(); } catch (_) {}
    $('mic').classList.add('rec'); $('mic').setAttribute('aria-label', 'עצור');
    document.body.classList.add('rec');
    $('stxt').textContent = 'מקשיב… דבר ברוסית';
    lock();
  }
  function stop() {
    running = false;
    try { rec && rec.stop(); } catch (_) {}
    closeSentence();
    $('mic').classList.remove('rec'); $('mic').setAttribute('aria-label', 'התחל להקשיב');
    document.body.classList.remove('rec');
    $('stxt').textContent = 'עצור. לחץ כדי להמשיך';
    try { wake && wake.release(); } catch (_) {}
  }
  $('mic').onclick = () => running ? stop() : start();
  document.addEventListener('visibilitychange', () => { if (running && document.visibilityState === 'visible') lock(); });
})();
</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});</script>
</body>
</html>
