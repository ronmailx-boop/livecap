<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7367f0">
<title>דובר · תרגום חי</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>🎤 מסך הדובר</h1>
  <span class="chip"><span class="dot" id="wsdot"></span><span id="wstxt">מתחבר…</span></span>
</header>
<main>
  <div class="card center">
    <div class="mut">קוד החדר</div>
    <div class="code" id="code">-----</div>
    <div class="mut" style="margin:6px 0 12px">👥 מאזינים: <b id="cnt">0</b></div>
    <div class="row">
      <button class="btn sec sm" id="share">📤 שתף קישור</button>
      <button class="btn sec sm" id="copy">📋 העתק</button>
      <button class="btn sec sm" id="newroom">🔄 חדר חדש</button>
    </div>
  </div>

  <div class="card center">
    <button class="mic" id="mic" aria-label="התחל">🎙️</button>
    <div id="state" class="mut">לחץ כדי להתחיל לדבר (רוסית)</div>
    <div id="err" class="err"></div>
  </div>

  <div class="card" style="flex:1;display:flex;flex-direction:column;min-height:0">
    <div class="mut" style="margin-bottom:6px">מה שזוהה (רוסית)</div>
    <div class="log" id="log"></div>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const rnd = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b % 32]).join('');

  let room = localStorage.getItem('room') || rnd(5);
  let token = localStorage.getItem('token') || rnd(24);
  const save = () => { localStorage.setItem('room', room); localStorage.setItem('token', token); $('code').textContent = room; };
  save();
  const link = () => location.origin + '/l/' + room;

  /* ---------- websocket ---------- */
  let ws, retry = 0, pending = [];
  const setWs = (on, txt) => { $('wsdot').className = 'dot ' + (on ? 'on' : 'bad'); $('wstxt').textContent = txt; };

  function connect() {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onopen = () => { retry = 0; ws.send(JSON.stringify({ t: 'host', room, token })); };
    ws.onmessage = ev => {
      const m = JSON.parse(ev.data);
      if (m.t === 'hosted') { setWs(true, 'מחובר'); $('cnt').textContent = m.n; pending.splice(0).forEach(p => ws.send(p)); }
      else if (m.t === 'count') $('cnt').textContent = m.n;
      else if (m.t === 'error') {
        if (m.msg === 'taken') { room = rnd(5); token = rnd(24); save(); ws.close(); }
        else $('err').textContent = 'שגיאה: ' + m.msg;
      }
    };
    ws.onclose = () => { setWs(false, 'מנותק'); setTimeout(connect, Math.min(1000 * 2 ** retry++, 8000)); };
  }
  connect();

  function sendSeg(id, text, final) {
    const s = JSON.stringify({ t: 'seg', id, text, final });
    if (ws && ws.readyState === 1) ws.send(s);
    else if (final && pending.length < 30) pending.push(s);
  }

  /* ---------- speech recognition ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec, running = false, segId = Date.now() % 1e9, lastInterim = '';
  const log = $('log');
  let interimEl = null;

  function addLog(text, interim) {
    if (interim) {
      if (!interimEl) { interimEl = document.createElement('div'); interimEl.className = 'i'; log.appendChild(interimEl); }
      interimEl.textContent = text;
    } else {
      if (interimEl) { interimEl.remove(); interimEl = null; }
      const d = document.createElement('div'); d.textContent = text; log.appendChild(d);
      while (log.children.length > 40) log.firstChild.remove();
    }
    log.scrollTop = log.scrollHeight;
  }

  function build() {
    rec = new SR();
    rec.lang = 'ru-RU';
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;
    rec.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        const t = r[0].transcript.trim();
        if (r.isFinal) {
          if (t) { sendSeg(segId, t, true); addLog(t, false); }
          segId++; lastInterim = '';
        } else interim += (interim ? ' ' : '') + t;
      }
      if (interim && interim !== lastInterim) {
        lastInterim = interim;
        sendSeg(segId, interim, false);
        addLog(interim, true);
      }
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        $('err').textContent = 'אין הרשאת מיקרופון. אשר אותה בהגדרות האתר ונסה שוב.';
        stop();
      } else if (e.error === 'network') $('err').textContent = 'שגיאת רשת בזיהוי הדיבור';
      else if (e.error !== 'no-speech' && e.error !== 'aborted') $('err').textContent = 'שגיאת זיהוי: ' + e.error;
    };
    rec.onend = () => {
      // Chrome ends sessions on silence; flush unfinished text and restart
      if (lastInterim) { sendSeg(segId, lastInterim, true); addLog(lastInterim, false); segId++; lastInterim = ''; }
      if (running) setTimeout(() => { try { rec.start(); } catch (_) {} }, 250);
    };
  }

  let wake;
  async function lock() { try { wake = await navigator.wakeLock.request('screen'); } catch (_) {} }

  function start() {
    if (!SR) { $('err').textContent = 'הדפדפן לא תומך בזיהוי דיבור. השתמש ב-Chrome.'; return; }
    $('err').textContent = '';
    build(); running = true;
    try { rec.start(); } catch (_) {}
    $('mic').classList.add('rec'); $('mic').textContent = '⏹';
    $('state').textContent = 'מקשיב… דבר ברוסית';
    lock();
  }
  function stop() {
    running = false;
    try { rec && rec.stop(); } catch (_) {}
    $('mic').classList.remove('rec'); $('mic').textContent = '🎙️';
    $('state').textContent = 'עצור. לחץ כדי להמשיך';
    try { wake && wake.release(); } catch (_) {}
  }
  $('mic').onclick = () => running ? stop() : start();
  document.addEventListener('visibilitychange', () => { if (running && document.visibilityState === 'visible') lock(); });

  /* ---------- share ---------- */
  $('share').onclick = async () => {
    const data = { title: 'תרגום חי', text: 'קוד חדר: ' + room, url: link() };
    if (navigator.share) { try { await navigator.share(data); } catch (_) {} }
    else { await navigator.clipboard.writeText(link()); $('share').textContent = '✔ הועתק'; }
  };
  $('copy').onclick = async () => { await navigator.clipboard.writeText(link()); $('copy').textContent = '✔ הועתק'; setTimeout(() => $('copy').textContent = '📋 העתק', 1500); };
  $('newroom').onclick = () => {
    if (!confirm('ליצור חדר חדש? המאזינים הנוכחיים ינותקו מהתרגום.')) return;
    room = rnd(5); token = rnd(24); save(); log.innerHTML = ''; ws.close();
  };
})();
</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});</script>
</body>
</html>
